<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nike Product Card</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Poppins", sans-serif;
      }
    </style>
  </head>

  <body class="bg-[#ead7d9] min-h-screen flex justify-center items-center p-5">
    <div class="bg-white rounded-xl shadow-lg max-w-4xl w-full p-8">
      <div class="flex flex-col md:flex-row items-center gap-10">
        <!-- Left Side -->
        <div class="flex-1">
          <img
            src="../images/shose.png"
            alt="Nike Shoe"
            class="w-full object-contain"
          />

          <div class="mt-8">
            <p class="text-xs uppercase tracking-widest text-gray-400 mb-3">
              Choose Size
            </p>

            <div class="flex flex-wrap gap-2">
              <button
                class="w-10 h-10 border border-gray-300 text-gray-500 hover:bg-pink-200 transition"
              >
                5
              </button>
              <button
                class="w-10 h-10 border border-gray-300 text-gray-500 hover:bg-pink-200 transition"
              >
                6
              </button>
              <button
                class="w-10 h-10 border border-gray-300 text-gray-500 hover:bg-pink-200 transition"
              >
                7
              </button>
              <button
                class="w-10 h-10 border border-gray-300 text-gray-500 hover:bg-pink-200 transition"
              >
                8
              </button>
              <button
                class="w-10 h-10 border border-gray-300 text-gray-500 hover:bg-pink-200 transition"
              >
                9
              </button>
              <button
                class="w-10 h-10 border border-gray-300 text-gray-500 hover:bg-pink-200 transition"
              >
                10
              </button>
              <button
                class="w-10 h-10 border border-gray-300 text-gray-500 hover:bg-pink-200 transition"
              >
                11
              </button>
              <button
                class="w-10 h-10 border border-gray-300 text-gray-500 hover:bg-pink-200 transition"
              >
                12
              </button>
            </div>
          </div>
        </div>

        <!-- Right Side -->
        <div class="flex-1">
          <p class="text-xs uppercase tracking-widest text-gray-400">
            Women's Running Shoe
          </p>

          <h1 class="text-4xl font-bold mt-2 leading-tight">
            NIKE EPIC REACT <br />
            FLYKNIT
          </h1>

          <h2 class="text-5xl font-semibold text-[#c9a0a7] mt-4">$150</h2>

          <p class="text-gray-500 leading-7 mt-6">
            The Nike Epic React Flyknit foam cushioning is responsive yet
            lightweight, durable yet soft. This creates the sensation that not
            only enhances the feeling of moving forward, but makes running feel
            fun, too.
          </p>

          <div class="flex mt-8">
            <button
              class="bg-[#d3a8af] hover:bg-[#c9969d] text-white font-semibold px-10 py-4"
            >
              ADD TO CART
            </button>

            <button class="bg-[#c9969d] hover:bg-[#b98b92] text-white px-6">
              ▼
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
